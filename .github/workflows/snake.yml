name: new snake game

on:
  schedule:
    - cron: "30 18 * * *"   # 00:00 IST, a fresh game every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: render today's game
        run: python tools/gen_snake.py

      - name: commit if it changed
        run: |
          git config user.name "snake-bot"
          git config user.email "snake-bot@users.noreply.github.com"
          git add assets/snake.svg
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "snake: new game"
            git push
          fi
