name: crawler

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# one move at a time, in order
concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'crawl:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # issue title and author are untrusted, so they only ever travel through env vars
      - name: apply move
        env:
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          set +e
          python .github/game/engine.py issue "$TITLE" "$LOGIN" > "$RUNNER_TEMP/reply.txt"
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "something broke on my side, check the action logs." > "$RUNNER_TEMP/reply.txt"
          fi
          exit 0

      - name: commit board
        run: |
          git config user.name "crawler-bot"
          git config user.email "crawler-bot@users.noreply.github.com"
          git add README.md .github/game/state.json
          if git diff --cached --quiet; then
            echo "board unchanged"
          else
            git commit -m "crawler: one step"
            git push
          fi

      - name: reply and close
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reply.txt"
          gh issue close "$NUMBER" --reason completed
